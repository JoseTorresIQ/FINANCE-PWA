<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.4"/>

  <!-- Radial ambient glow -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Financial Coin Badge -->
  <g transform="translate(110, 110)">
    <circle cx="40" cy="40" r="44" fill="url(#emeraldGrad)" filter="url(#glow)"/>
    <circle cx="40" cy="40" r="36" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,4" opacity="0.7"/>
    <text x="40" y="52" font-family="'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle">$</text>
  </g>

  <!-- Financial Bar Chart -->
  <rect x="140" y="260" width="46" height="110" rx="14" fill="url(#cyanGrad)"/>
  <rect x="206" y="210" width="46" height="160" rx="14" fill="url(#indigoGrad)"/>
  <rect x="272" y="160" width="46" height="210" rx="14" fill="url(#emeraldGrad)"/>
  <rect x="338" y="120" width="46" height="250" rx="14" fill="#34d399"/>

  <!-- Trend Growth Line -->
  <polyline points="163,250 229,198 295,148 361,108" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend Indicator Point -->
  <circle cx="361" cy="108" r="16" fill="#ffffff" stroke="#10b981" stroke-width="6" filter="url(#glow)"/>
</svg>
